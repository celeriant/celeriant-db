[package]
name = "celeriant_shard"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
small-metablock = [
    "celeriant_wal/small-metablock",
    "celeriant_wire/small-metablock",
    "celeriant_distributed/small-metablock",
    "celeriant_msg/small-metablock",
    "celeriant_watch/small-metablock",
    "celeriant_memcache/small-metablock",
    "celeriant_rotating_log/small-metablock",
    "celeriant_client_glommio/small-metablock",
]

[dependencies]
celeriant_distributed = { path = "../celeriant_distributed" }
celeriant_msg = { path = "../celeriant_msg" }
celeriant_wire = { path = "../celeriant_wire" }
celeriant_wal = { path = "../celeriant_wal" }
celeriant_disk = { path = "../celeriant_disk" }
celeriant_watch = { path = "../celeriant_watch" }
celeriant_memcache = { path = "../celeriant_memcache" }
celeriant_rotating_log = { path = "../celeriant_rotating_log" }
celeriant_client_glommio = { path = "../celeriant_client_glommio" }
glommio.workspace = true
futures-lite.workspace = true
lru.workspace = true
xxhash-rust.workspace = true
crc32c.workspace = true
deepsize.workspace = true
bytes.workspace = true
tracing.workspace = true
metrics.workspace = true
blake3.workspace = true
rustls.workspace = true
apache-avro.workspace = true
prost.workspace = true
prost-reflect.workspace = true
base64.workspace = true
jsonschema.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
uuid.workspace = true
criterion.workspace = true
num_cpus.workspace = true
# Only `write_probe` uses this. Production sets `#[global_allocator] MiMalloc` in
# celeriant/src/main.rs, so a bench without it measures glibc malloc against a server running
# mimalloc — and the write path's leading allocation suspects would be tuned against the wrong
# allocator. Dev-dependency: the server binary is unaffected.
mimalloc.workspace = true

[lib]
bench = false

[[bench]]
name = "exists_benchmark"
harness = false

[[bench]]
name = "write_benchmark"
harness = false

# Fixed-iteration append probe, measured from outside with `perf stat`.
# A `[[bin]]` could not do this job: `tempfile` and `mimalloc` are dev-dependencies.
[[bench]]
name = "write_probe"
harness = false

[[bench]]
name = "coordinator_benchmark"
harness = false

[[bench]]
name = "aggregate_count_benchmark"
harness = false

[[bench]]
name = "bloom_size_benchmark"
harness = false

[[bench]]
name = "cold_read_benchmark"
harness = false

[[bench]]
name = "warmup_benchmark"
harness = false

[[bench]]
name = "reverse_metablock_scan_benchmark"
harness = false

[[bench]]
name = "client_seq_scan_benchmark"
harness = false

[[bench]]
name = "negative_scan_present_client_benchmark"
harness = false

[[bench]]
name = "read_stream_benchmark"
harness = false

[[bench]]
name = "compression_benchmark"
harness = false

[[bench]]
name = "list_aggregates_benchmark"
harness = false

[[bench]]
name = "replication_batch_benchmark"
harness = false

[[bench]]
name = "schema_validation_benchmark"
harness = false

[[bench]]
name = "list_paged_benchmark"
harness = false