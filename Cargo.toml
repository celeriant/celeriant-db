[workspace]
members = [
    "eventplanedb_storage_structures",
    "eventplanedb_storage_stateless",
    "eventplanedb_storage_stateful",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["UtilityDelta"]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lru = "0.16.0"
fastbloom = "0.14.0"
crc32fast = "1.5.0"
bincode = "2.0.1"
zstd = "0.13.3"
brotli = "8.0.2"
flate2 = "1.1.2"
snap = "1.1.1"
serde = { version = "1.0.219", features = ["derive", "rc"] }
base64 = "0.22.1"
io-uring = "0.7.9"
tempfile = "3.21.0"
rand = "0.9.2"