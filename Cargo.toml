[workspace]
members = [
    "eventplanedb_structures",
    "eventplanedb_core",
    "eventplanedb_server",
    "eventplanedb_client",
    "eventplanedb_client_example",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["UtilityDelta"]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lru = "0.16.2"
fastbloom = "0.14.0"
crc32c = "0.6.8"
bincode = "2.0.1"
zstd = "0.13.3"
brotli = "8.0.2"
flate2 = "1.1.4"
snap = "1.1.1"
serde = { version = "1.0.219", features = ["derive", "rc"] }
base64 = "0.22.1"
io-uring = "0.7.9"
tempfile = "3.21.0"
rand = "0.9.2"
glommio = { git = "https://github.com/utilitydelta/glommio", branch = "tcp-into-raw-fd-support" }
futures-lite = "2.6.1"
async-trait = "0.1.89"
ahash = "0.8.12"
env_logger = "0.11.8"
fastrand = "2.3.0"
log = "0.4.28"
num_cpus = "1.17.0"
thiserror = "2.0.12"
mimalloc = "0.1.48"
rmp-serde = "1.3.0"
criterion = "0.7.0"
uuid = { version = "1.18.1", features = ["v4"] }
walkdir = "2.5.0"
clap = { version = "4.5.53", features = ["derive"] }
ctrlc = { version = "3.5.1", features = ["termination"] }
nix = "0.30.1"
signal-hook = "0.3.18"
futures-util = "0.3.31"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
chrono = "0.4.42"
tokio-util = { version = "0.7.17", features = ["compat"]}
futures = "0.3.31"
flume = "0.11.1"
bytes = "1.11.0"
object_store = { version = "0.12.4", features = ["aws"] }
hostname = "0.4.2"