[workspace]
# In alphabetical order
members = [
    "event_storage",
    "event_storage_threads",
    "eventplanedb_server"
]
default-members = ["eventplanedb_server"]

resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["UtilityDelta"]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bincode = "2.0.1"
serde = "1.0.219"
simd-json = "0.15.1"
stl_io = "0.8.5"
image = "0.25.6"
rand = "0.9.1"
nanoid = "0.4.0"
tempfile = "3.20.0"
zstd = "0.13.3"
criterion = "0.6.0"
postcard = { version = "1.1.2", features = ["alloc"] }
tikv-jemallocator = { version = "0.5", features = ["unprefixed_malloc_on_supported_platforms"] }
core_affinity = "0.8.3"
crossbeam = "0.8.4"
ahash = "0.8.12"
tokio = { version = "1.46.0", features = ["full"] }
futures = "0.3.31"
axum = "0.8.4"
chrono = "0.4.41"
tower-http = { version = "0.6.6", features = ["cors"] }
