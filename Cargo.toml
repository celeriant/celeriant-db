[workspace]
members = ["celeriant_aggregate","celeriant_client_glommio","celeriant_client_tokio","celeriant_disk","celeriant_msg","celeriant_wal", "celeriant_wire"]

resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Celeriant"]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive", "rc"] }
base64 = "0.22.1"
bincode = "2.0.1"
snap = "1.1.1"
rmp-serde = "1.3.0"
zstd = "0.13.3"
brotli = "8.0.2"
flate2 = "1.1.5"
futures-lite = "2.6.1"
criterion = "0.8.0"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["compat"]}
futures-util = "0.3.31"
glommio = "0.9.0"
tempfile = "3.23.0"
fastbloom = "0.14.0"
uuid = { version = "1.18.1", features = ["v4"] }
lru = "0.16.2"
num_cpus = "1.17.0"
crc32c = "0.6.8"