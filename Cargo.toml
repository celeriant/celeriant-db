[workspace]
members = [
    "eventplanedb_storage_structures",
    "eventplanedb_storage_stateless",
    "eventplanedb_storage_stateful",
    "eventplanedb_storage_threaded",
    "eventplanedb_glommio",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["UtilityDelta"]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
base64 = "0.22.1"
bincode = "2.0.1"
brotli = "8.0.2"
crc32fast = "1.5.0"
fastbloom = "0.14.0"
flate2 = "1.1.2"
lru = "0.16.0"
serde = { version = "1.0.219", features = ["derive", "rc"] }
snap = "1.1.1"
tempfile = "3.21.0"
zstd = "0.13.3"
rand = "0.9.2"
io-uring = "0.7.9"
core_affinity = "0.8.3"
crossbeam = "0.8.4"
ahash = "0.8.12"
tokio = { version = "1.46.0", features = ["full"] }
futures = "0.3.31"
thiserror = "2.0.12"
glommio = "0.9"
futures-lite = "2.6.1"
clap = { version = "4.5.47", features = ["derive"] }