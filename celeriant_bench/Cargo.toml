[package]
name = "celeriant_bench"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "celeriant_bench"
path = "src/lib.rs"

[[bin]]
name = "celeriant-bench"
path = "src/main.rs"

[dependencies]
celeriant_client_tokio = { path = "../celeriant_client_tokio" }
celeriant_crypto = { path = "../celeriant_crypto" }
celeriant_wal = { path = "../celeriant_wal" }
celeriant_msg = { path = "../celeriant_msg" }
tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Only so the error-classification table can name a `WireError` value.
celeriant_wire = { path = "../celeriant_wire", version = "0.2.0" }
