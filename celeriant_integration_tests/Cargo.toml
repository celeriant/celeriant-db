[package]
name = "celeriant_integration_tests"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "celeriant-integration-tests"
path = "src/main.rs"

[features]
default = []
small-metablock = [
    "celeriant_lib/small-metablock",
    "celeriant_client_tokio/small-metablock",
    "celeriant_msg/small-metablock",
    "celeriant_runtimes/small-metablock",
    "celeriant_wire/small-metablock",
    "celeriant_wal/small-metablock",
    "celeriant_distributed/small-metablock",
]

[dependencies]
celeriant_lib = { package = "celeriant", path = "../celeriant" }
celeriant_client_tokio = { path = "../celeriant_client_tokio" }
celeriant_msg = { path = "../celeriant_msg" }
celeriant_runtimes = { path = "../celeriant_runtimes" }
celeriant_wire = { path = "../celeriant_wire" }
celeriant_wal = { path = "../celeriant_wal" }
celeriant_distributed = { path = "../celeriant_distributed" }
celeriant_crypto = { path = "../celeriant_crypto" }
celeriant_ktls = { path = "../celeriant_ktls" }
object_store.workspace = true
bytes.workspace = true
bincode.workspace = true
futures.workspace = true
tokio.workspace = true
tokio-util.workspace = true
rand.workspace = true
tempfile.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
reqwest = { version = "0.12", features = ["blocking"] }
apache-avro.workspace = true
prost.workspace = true
prost-reflect.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
clap.workspace = true
wait-timeout.workspace = true
