[package]
name = "celeriant_client_tokio"
description = "Async Tokio client for the Celeriant event store with connection pooling, leader routing, and TLS"
keywords = ["event-sourcing", "database", "eventstore", "celeriant"]
categories = ["database"]
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
small-metablock = ["celeriant_wal/small-metablock", "celeriant_msg/small-metablock", "celeriant_wire/small-metablock"]

[dependencies]
celeriant_crypto = { path = "../celeriant_crypto", version = "0.1.2" }
celeriant_msg = { path = "../celeriant_msg", version = "0.1.2" }
celeriant_wire = { path = "../celeriant_wire", version = "0.1.2" }
celeriant_client_wire = { path = "../celeriant_client_wire", version = "0.1.2" }
celeriant_wal = { path = "../celeriant_wal", version = "0.1.2" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
tokio-util.workspace = true
futures-lite.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
