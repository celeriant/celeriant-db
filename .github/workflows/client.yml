name: Publish Client Libraries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build client crates
        run: cargo build --release -p celeriant_wal -p celeriant_crypto -p celeriant_wire -p celeriant_msg -p celeriant_client_wire -p celeriant_client_tokio

      - name: Test client crates
        run: cargo test -p celeriant_wal -p celeriant_crypto -p celeriant_wire -p celeriant_msg -p celeriant_client_wire -p celeriant_client_tokio

  publish:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        # Topological order; cargo waits for each publish to be available before
        # returning, so the next crate's verify build can resolve it.
        # Idempotent: already-published versions are skipped, so a re-dispatch
        # after a mid-chain failure (e.g. the new-crate rate limit) resumes
        # where the previous run stopped.
        run: |
          set -u
          for crate in celeriant_wal celeriant_crypto celeriant_wire celeriant_msg celeriant_client_wire celeriant_client_tokio; do
            out=$(cargo publish -p "$crate" 2>&1) && { echo "published $crate"; continue; }
            echo "$out"
            if echo "$out" | grep -q "already exists"; then
              echo "$crate already published, skipping"
            else
              exit 1
            fi
          done
